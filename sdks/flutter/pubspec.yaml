name: rynl10n
description: >-
  앱 업데이트·심사 없이 번역을 배포하는 오픈소스 원격 로컬라이제이션 SDK.
  빌드타임에 구운 번들(fallback)과 런타임 원격 오버레이의 2계층으로 항상 완전한 번역을 보장한다.
# lockstep — ios·android·web과 항상 동일한 버전으로 동시 릴리스한다(기획서 6.5).
version: 0.1.0
repository: https://github.com/devryner/RynL10n
issue_tracker: https://github.com/devryner/RynL10n/issues
documentation: https://github.com/devryner/RynL10n/blob/main/sdks/flutter/README.md
topics:
  - localization
  - i18n
  - internationalization

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.0        # SHA-256
  unorm_dart: ^0.3.0    # 유니코드 NFC 정규화(JCS 결정성)
  http: ^1.2.0          # rynl10n_http.dart 어댑터 전용(웹 포함 전 플랫폼). 코어는 이걸 쓰지 않는다.

dev_dependencies:
  test: ^1.24.0
