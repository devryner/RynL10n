####################################################################################################
# CI — 기획서 6.5 "릴리스 CI 게이트"
#
# 여기 있는 잡 전체가 릴리스의 게이트다. `release.yml`이 이 워크플로를 `workflow_call`로 그대로
# 재사용하므로 **게이트와 일상 CI가 갈라질 수 없다** — 갈라지면 "테스트는 통과했는데 릴리스가 깨진다"가
# 생긴다. 게시는 되돌릴 수 없으니(npm·pub.dev·Maven Central 모두 게시 후 사실상 불변) 검증은 전부
# 퍼블리시 이전에 끝나야 한다.
#
# 5개 컴포넌트 테스트 + 골든 벡터 결정성이 게이트다. 마지막 항목이 이 저장소의 핵심 계약이다 —
# 골든 벡터는 4개 언어 SDK가 같이 읽는 언어 무관 계약이라, 재생성 결과가 커밋 상태와 다르면
# "무엇이 정합인지"를 아무도 말할 수 없게 된다.
####################################################################################################
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml이 게이트로 호출한다

# 같은 브랜치에서 밀려오는 커밋은 마지막 것만 검증한다. 단 릴리스(태그) 실행은 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  reference:
    name: TS 참조 구현 · 백엔드 · 골든 벡터
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 네이티브 타입 스트리핑(빌드 스텝 0)이 전제라 23.6+ 가 하한이다.
          node-version: "24.x"
      # devDependencies는 typescript·@types/node뿐이고 lockfile이 없다(런타임 의존성 0 원칙).
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck:backend
      - run: npm run test:backend

      # 골든 벡터 = 크로스언어 계약. 재생성 결과가 커밋 상태와 1바이트라도 다르면 릴리스를 막는다.
      - name: 골든 벡터 결정성 (재생성 후 diff 없음)
        run: |
          npm run gen:golden
          git diff --exit-code --stat fixtures/golden \
            || { echo "::error::골든 벡터가 커밋 상태와 다릅니다. 'npm run gen:golden' 후 결과를 커밋하고 각 SDK 테스트를 재실행하세요."; exit 1; }

  web:
    name: Web SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
        working-directory: sdks/web
      - run: npm test
        working-directory: sdks/web
      # 게시본은 트랜스파일된 .js+.d.ts다(6.5). 태그를 달고 나서 빌드가 깨진 걸 알면 늦으므로
      # 평상시 CI에서도 게시 빌드를 돌려 둔다.
      - name: 게시 빌드 스모크
        run: npm run build:publish
        working-directory: sdks/web

  ios:
    name: iOS SDK
    # CryptoKit·Foundation 의존이라 Apple 플랫폼에서만 돈다(Linux는 swift-crypto 대체가 선행).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # 패키지 매니페스트는 저장소 루트에 있다(SwiftPM 제약 — 루트 Package.swift 주석 참조).
      # 소스는 여전히 sdks/ios/ 아래이고, 타깃이 path로 가리킨다.
      - run: swift test
      # 차별점 ①(빌드타임 자동 번들링)의 소비 경로. 플러그인이 빌드 그래프에 붙는지까지 확인한다.
      - name: SPM 플러그인 소비 예제 빌드
        run: swift build
        working-directory: examples/ios-consumer

  android:
    name: Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # 코어는 루트 JVM 모듈이라 Android SDK 없이 돈다 — 골든 벡터 검증이 Android 툴체인에
      # 묶이지 않게 한 구조 결정(6.5)이 CI에서도 그대로 이득이다.
      - run: ./gradlew test
        working-directory: sdks/android
      # 배포 아티팩트는 AAR 하나뿐이다. 빌드 자체가 깨지지 않는지 매번 확인한다.
      - run: ./gradlew :library:assembleRelease
        working-directory: sdks/android

  flutter:
    name: Flutter SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.5"
      - run: dart pub get
        working-directory: sdks/flutter
      - run: dart test
        working-directory: sdks/flutter
      # 순수 Dart 코어라 위젯 없이 도는 예제다. pub.dev 점수 요건이기도 하다(6.5).
      - run: dart run example/example.dart
        working-directory: sdks/flutter
      - run: dart analyze --fatal-infos
        working-directory: sdks/flutter
