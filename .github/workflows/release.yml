####################################################################################################
# Release — 기획서 6.5 "릴리스 CI"
#
# 태그 하나(`v0.1.0`)에서 4개 채널을 동시 퍼블리시한다. 4개 SDK는 **lockstep**이라 버전 번호가 곧
# "어느 조합이 정합인가"의 답이고, 부분 성공은 그 계약을 깬다.
#
# **되돌리는 롤백은 없다.** npm·pub.dev·Maven Central 모두 게시 후 사실상 불변이고, SPM은 태그가 곧
# 버전이라 삭제·재작성이 소비자의 `Package.resolved`를 조용히 깨뜨린다. 그래서 이 워크플로의 구조는
# 하나뿐이다 — **검증은 전부 앞에, 게시는 전부 뒤에.** gate와 lockstep이 끝나기 전에는 어떤 잡도
# 레지스트리에 손대지 않는다.
#
# ── 필요한 시크릿 ──────────────────────────────────────────────────────────────────────────────
#   MAVEN_CENTRAL_URL         업로드 대상(레거시 OSSRH / Central Portal에 따라 다름 → 저장소에 박지 않는다)
#   MAVEN_CENTRAL_USERNAME    Sonatype 계정
#   MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY               GPG 개인키(ASCII armored). 파일이 아니라 메모리로 넘긴다
#   SIGNING_PASSWORD
# **npm과 pub.dev는 시크릿이 없다** — 둘 다 GitHub OIDC로 인증한다. 각 레지스트리의 패키지 설정에
# 이 저장소와 워크플로를 등록해 두어야 하고, **그 등록은 패키지가 이미 존재해야만 가능하다**
# (npm=Trusted Publisher, pub.dev=Automated publishing). 그래서 두 채널의 **첫 버전은 수동 게시**다.
# 장수명 게시 토큰을 두지 않는 이유이기도 하다 — npm은 2027-01부터 2FA 우회 토큰의 직접 게시를 폐지한다.
#
# ── 게시 후 ────────────────────────────────────────────────────────────────────────────────────
# 이 워크플로의 dry-run은 **만드는 쪽**만 본다(`npm pack`·`pub publish --dry-run`·`publishToMavenLocal`).
# 받는 쪽 — 소비자가 실 좌표로 설치해 `t()`가 도는지 — 은 태그를 민 뒤 로컬에서 확인한다:
#   npm run smoke:consumer          (tools/consumer-smoke/README.md)
####################################################################################################
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 각 채널의 dry-run까지만 수행"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── 게이트 ───────────────────────────────────────────────────────────────────────────────────
  # 일상 CI와 **같은 워크플로**를 호출한다. 게이트를 따로 쓰면 둘이 갈라져 "테스트는 통과했는데
  # 릴리스가 깨진다"가 생긴다. 5개 컴포넌트 테스트 + 골든 벡터 결정성이 여기서 끝난다.
  gate:
    uses: ./.github/workflows/ci.yml

  lockstep:
    name: lockstep 버전 검사
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전 결정 (태그 → 릴리스 · 수동 실행 → dry-run)
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            dry_run=false
          else
            # 수동 실행에는 태그가 없다. 매니페스트 값을 읽어 검사만 하고, 게시는 입력값을 따른다.
            version="$(node -p "require('./sdks/web/package.json').version")"
            dry_run="${{ inputs.dry_run }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "릴리스 버전: $version (dry-run: $dry_run)"

      # 네 매니페스트가 한 값을 가리키는지 본다. 여기서 걸러야 "npm은 0.1.0인데 pub.dev는 0.0.9"
      # 같은 상태가 영구히 남는 사고를 막는다 — 게시 후에는 되돌릴 수 없다.
      - name: 4개 매니페스트가 같은 버전인가
        run: |
          expected="${{ steps.resolve.outputs.version }}"
          web="$(node -p "require('./sdks/web/package.json').version")"
          flutter="$(sed -n 's/^version: *//p' sdks/flutter/pubspec.yaml | head -1 | tr -d '\r')"
          android="$(sed -n 's/.*rynl10nVersion = "\([^"]*\)".*/\1/p' sdks/android/library/build.gradle.kts | head -1)"

          fail=0
          for pair in "web:$web" "flutter:$flutter" "android:$android"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$expected" ]; then
              echo "::error::$name 버전이 $value 입니다(기대: $expected). lockstep이 깨졌습니다."
              fail=1
            fi
          done
          # iOS는 매니페스트에 버전이 없다 — SPM은 git 태그가 곧 버전이라 태그 자체가 값이다.
          [ "$fail" = "0" ] && echo "lockstep OK — web·flutter·android 모두 $expected (iOS는 태그 $expected)"
          exit "$fail"

  # ── 게시 (게이트 통과 후에만) ────────────────────────────────────────────────────────────────
  npm:
    name: 게시 · npm (@rynl10n/web)
    runs-on: ubuntu-latest
    needs: [gate, lockstep]
    permissions:
      contents: read
      id-token: write # OIDC 인증 + provenance 서명
    steps:
      - uses: actions/checkout@v4
      # registry-url은 남긴다 — .npmrc의 레지스트리 지정은 OIDC 경로에서도 필요하다.
      # NODE_AUTH_TOKEN은 주지 않는다(아래 참조).
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      # OIDC 교환은 npm 11.5.1+에서만 동작한다. Node 24 번들 버전에 맡기면 러너 이미지가 바뀔 때
      # 조용히 미달할 수 있고, 미달하면 인증이 토큰 경로로 떨어지는데 그 토큰이 없어 게시가 죽는다.
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      # prepack이 게시 빌드(tsc → .js + .d.ts)를 돌린다. 소스를 그대로 올리면 Node 소비자가
      # node_modules 안의 .ts를 실행하지 못한다(6.5 정정 사항).
      #
      # **인증은 Trusted Publishing(OIDC)** — 시크릿을 쓰지 않는다. npm의 패키지 설정에 이 저장소와
      # 이 워크플로 파일명(release.yml)이 Trusted Publisher로 등록돼 있어야 한다. provenance는
      # OIDC 게시에 자동으로 붙으므로 --provenance를 명시하지 않는다(명시하면 중복 지정이다).
      # **이미 게시된 버전이면 건너뛴다.** npm은 같은 버전 재게시를 거부하는데(dry-run도 사전 확인을
      # 하므로 거기서부터 죽는다), 부트스트랩 때문에 첫 버전은 이 워크플로 밖에서 손으로 올라간다.
      # 가드가 없으면 그 버전의 태그가 npm 잡을 영구히 빨갛게 만들고, 4채널 중 일부만 성공한 실행과
      # 구분되지 않는다. 워크플로 재실행 안전성도 여기서 같이 얻는다.
      - name: 게시
        working-directory: sdks/web
        env:
          VERSION: ${{ needs.lockstep.outputs.version }}
        run: |
          if npm view "@rynl10n/web@$VERSION" version >/dev/null 2>&1; then
            echo "@rynl10n/web@$VERSION 은 이미 게시돼 있다 — 건너뛴다."
            exit 0
          fi
          if [ "${{ needs.lockstep.outputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi

  pub:
    name: 게시 · pub.dev (rynl10n)
    runs-on: ubuntu-latest
    needs: [gate, lockstep]
    permissions:
      contents: read
      id-token: write # pub.dev는 시크릿 없이 OIDC로 인증한다
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.5"
      - run: dart pub get
        working-directory: sdks/flutter
      # npm과 같은 이유의 가드다. 다만 pub은 **실패 지점이 더 늦다** —
      # `dart pub publish --dry-run`은 로컬 검증만 하므로 dry-run은 통과하고 실제 게시에서 죽는다.
      # 그래서 이 가드가 없으면 dry-run이 초록인 채로 태그 릴리스만 실패한다.
      - name: 게시
        working-directory: sdks/flutter
        env:
          VERSION: ${{ needs.lockstep.outputs.version }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/rynl10n/versions/$VERSION")"
          if [ "$code" = "200" ]; then
            echo "rynl10n $VERSION 은 이미 게시돼 있다 — 건너뛴다."
            exit 0
          fi
          if [ "${{ needs.lockstep.outputs.dry_run }}" = "true" ]; then
            dart pub publish --dry-run
          else
            dart pub publish --force
          fi

  maven:
    name: 게시 · Maven Central (com.devryner.rynl10n:android)
    runs-on: ubuntu-latest
    needs: [gate, lockstep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # 서명·업로드 설정은 환경변수가 있을 때만 켜진다(library/build.gradle.kts).
      # dry-run에서는 URL을 주지 않아 로컬 저장소까지만 간다.
      - name: 게시
        working-directory: sdks/android
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ "${{ needs.lockstep.outputs.dry_run }}" = "true" ]; then
            ./gradlew :library:publishToMavenLocal
          else
            MAVEN_CENTRAL_URL="${{ secrets.MAVEN_CENTRAL_URL }}" \
              ./gradlew :library:publishReleasePublicationToMavenCentralRepository
          fi

      # **업로드는 여기서 끝나지 않는다.** 위 Gradle 태스크는 OSSRH Staging API에 *올리기만* 한다.
      # 이 승격 호출이 없으면 배포가 스테이징에 머물러 central.sonatype.com에 나타나지도,
      # Maven Central에 게시되지도 않는다 — 태그를 밀어도 Maven만 조용히 빠진다.
      # dry-run은 publishToMavenLocal까지만 가므로 이 갭을 영영 잡지 못한다(2026-08-25 검증이 놓친 자리).
      #
      # `publishing_type=automatic`은 검증 통과 시 사람 개입 없이 릴리스한다. 나머지 3채널은 태그 하나로
      # 즉시 영구 게시되는데 Maven만 Portal 수동 승인을 남기면, 그 한 번을 잊는 순간 "버전 번호가 곧
      # 정합 조합"이라는 lockstep 계약이 조용히 거짓이 된다. 게이트는 이미 전부 앞에 있다(gate·lockstep).
      - name: Central Portal 승격 (스테이징 → 릴리스)
        if: needs.lockstep.outputs.dry_run != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          # 이 API는 Basic이 아니라 **Bearer + base64(user:pass)**를 받는다.
          # 변환값은 Actions의 시크릿 마스킹을 타지 않으므로 절대 출력하지 않는다.
          # GNU base64는 76자마다 줄을 바꾼다 — -w0가 없으면 헤더가 깨진다.
          auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          code="$(curl -sS -o /tmp/promote.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $auth" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.devryner?publishing_type=automatic")"
          echo "승격 응답: HTTP $code"
          cat /tmp/promote.out || true
          case "$code" in
            2*) echo "승격 요청 수락 — 검증 통과 시 자동 릴리스된다(인덱싱까지 수 시간)." ;;
            *)  echo "::error::Central Portal 승격 실패(HTTP $code). 산출물은 스테이징에 남아 있다."
                echo "::error::DELETE /manual/drop/repository/{repository_key} 로 정리한 뒤 재시도해야 한다."
                exit 1 ;;
          esac

  # ── iOS(SwiftPM)에 게시 잡이 없는 이유 ────────────────────────────────────────────────────────
  # SwiftPM에는 레지스트리 업로드가 없다 — **git 태그가 곧 버전**이다. 패키지 매니페스트가 저장소
  # 루트의 `Package.swift`이므로(그 파일 주석 참조), 이 워크플로를 띄운 `v*` 태그 자체가 이미
  # SPM 배포다. 소비자는 `.package(url: "https://github.com/devryner/RynL10n", from: "0.1.0")`.
  #
  # 그래서 여기에 할 일이 없다. 전에는 `sdks/ios/`를 미러 저장소로 subtree push하는 잡이 있었으나,
  # 매니페스트를 루트로 올리면서 미러 저장소·deploy key 시크릿·이 잡이 한꺼번에 사라졌다.
  #
  # **태그 삭제·재작성 금지**(6.5). SPM은 레지스트리 심사가 없고 태그가 곧 버전이라,
  # 소비자의 `Package.resolved`가 커밋 해시를 고정하고 있어 조용히 깨진다.
